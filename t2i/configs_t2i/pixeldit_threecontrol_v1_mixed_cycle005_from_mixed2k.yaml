model:
  model: PixDiTControlTrainer
  image_size: 512
  multi_scale: false
  mixed_precision: bf16
  fp32_attention: false
  qk_norm: false
  attn_type: linear
  ffn_type: glumbconv
  use_pe: false
  class_dropout_prob: 0.1
  aspect_ratio_type: ASPECT_RATIO_512
  resume_from:
    checkpoint: null
    load_ema: false
    resume_optimizer: false
    resume_lr_scheduler: false
  extra:
    patch_size: 16
    hidden_size: 1536
    pixel_hidden_size: 16
    pixel_attn_hidden_size: 1152
    num_groups: 24
    pixel_num_groups: 16
    patch_depth: 14
    pixel_depth: 2
    num_text_blocks: 4
    txt_embed_dim: 2304
    txt_max_length: 300
    use_text_rope: true
    text_rope_theta: 10000.0
    repa_encoder_index: 6
    use_pixel_abs_pos: true
    use_depth_condition: true
    control_mode: multi
    depth_channels: 1
    n_local_controls: 3
    control_names:
    - depth
    - seg
    - edge
    init_gate_logits:
    - 0.5
    - 0.0
    - -0.5
    depth_base_channels: 64
    depth_max_channels: 512
    inject_every: 1
    init_gate: 1.0
    enable_structure_inject: true
    alpha_inject: 2.0
    control_structure_inject:
    - true
    - true
    - false
    freeze_backbone: true
    freeze_depth_branch: false
    freeze_control_branches: []
    pretrained_ckpt: ./universal_pix_t2i_workdirs/exp_pixeldit_threecontrol_v1_mixed_smalllr_from_softcanny2k/checkpoints/epoch_1_step_2000.pth
    load_strict: false
    load_prefix: core.
    depth_branch_lr_scale: 0.05
    seg_branch_lr_scale: 0.1
    edge_branch_lr_scale: 0.1
    gate_lr_scale: 0.5
text_encoder:
  text_encoder_name: gemma-2-2b-it
  caption_channels: 2304
  model_max_length: 300
  y_norm: true
  y_norm_scale_factor: 1.0
  chi_prompt: []
scheduler:
  train_sampling_steps: 1000
  predict_flow_v: true
  noise_schedule: linear_flow
  flow_shift: 3.0
  weighting_scheme: logit_normal
  logit_mean: -0.8
  logit_std: 0.8
  pred_sigma: false
  learn_sigma: false
  vis_sampler: flow_dpm-solver
  sigma_data: 0.5
  timestep_norm_scale_factor: 1.0
train:
  train_batch_size: 16
  num_epochs: 100
  num_workers: 10
  seed: 1
  gradient_accumulation_steps: 4
  grad_checkpointing: true
  gradient_clip: 0.1
  optimizer:
    type: CAMEWrapper
    lr: 2.0e-05
    betas:
    - 0.9
    - 0.999
    - 0.9999
    eps:
    - 1.0e-30
    - 1.0e-16
    weight_decay: 0.0
  lr_schedule: constant
  lr_schedule_args:
    num_warmup_steps: 0
  override_lr_on_resume: true
  visualize: true
  save_model_steps: 2000
  save_model_epochs: 5
  log_interval: 20
  ema_update: true
  ema_rate: 0.999
  repa_loss_weight: 0.0
  early_stop_hours: 10000.0
  null_embed_root: ./output/pretrained_models/
  valid_prompt_embed_root: ./output/tmp_embed/
vae:
  vae_type: none
  vae_latent_dim: 3
  vae_downsample_rate: 1
work_dir: ./universal_pix_t2i_workdirs/exp_pixeldit_threecontrol_v1_mixed_cycle005_first200_from_mixed2k
report_to: tensorboard
tracker_project_name: pixeldit_control
name: pixeldit_threecontrol_v1_mixed_cycle005_first200_from_mixed2k
loss_report_name: loss
control:
  enabled: true
  mode: multi
  inject_t_min: 0.0
  inject_t_max: 1.0
  cycle_weight: 0.005
  cycle_t_min: 0.3
  cycle_t_max: 1.0
  cycle_subbatch_size: 2
  cycle_apply_every: 1
  num_controls: 3
  depth_channels: 1
  depth_branch_lr_scale: 0.05
  seg_branch_lr_scale: 0.1
  edge_branch_lr_scale: 0.1
  gate_lr_scale: 0.5
  gate_log_every: 100
  enable_control_dropout: true
  control_modes:
  - depth
  - seg
  - edge
  - depth_seg
  - depth_edge
  - seg_edge
  - depth_seg_edge
  control_probs:
  - 0.15
  - 0.15
  - 0.15
  - 0.12
  - 0.12
  - 0.12
  - 0.19
  cycle_loss:
    type: MultiConditionCycleLoss
    init_args:
      depth_weight: 1.0
      seg_weight: 1.0
      edge_weight: 1.0
      depth_cycle_loss:
        type: DA3CoarseToFinePyramidDepthCycleLoss
        init_args:
          da3_src: ./third_party/depth-anything-3/src
          da3_model_dir: ./pretrained/DA3NESTED-GIANT-LARGE-1.1
          process_res: 504
          loss_res: 128
          affine_align: true
          smooth_l1_beta: 0.05
          enable_pyramid_cycle_loss: true
          cycle_scales:
          - 512
          - 256
          - 128
          - 64
          cycle_scale_weights:
          - 0.1
          - 0.25
          - 0.75
          - 0.25
          enable_coarse_to_fine_cycle: true
          enable_fine_sobel_weight: true
          alpha_fine_sobel: 0.3
          enable_fine_grad_loss: false
          lambda_fine_grad: 0.0
          enable_fine_debug_viz: true
          fine_debug_dir: ./outputs/pixeldit_threecontrol_mixed_cycle005_depth_fine_debug
          fine_debug_every: 100
          fine_debug_max_images: 4
          silog_lambda: 0.85
          silog_eps: 0.001
          gt_norm: minmax
          pred_norm: minmax
          normalize_input: true
          load_dtype: fp32
      seg_cycle_loss:
        type: SAM2SegCycleLoss
        init_args:
          loss_res: 128
          smooth_l1_beta: 0.05
          enable_pyramid_cycle_loss: true
          cycle_scales:
          - 512
          - 256
          - 128
          - 64
          cycle_scale_weights:
          - 0.1
          - 0.25
          - 0.75
          - 0.25
          enable_coarse_to_fine_cycle: true
          enable_fine_sobel_weight: true
          alpha_fine_sobel: 0.3
          enable_fine_grad_loss: false
          lambda_fine_grad: 0.0
          enable_fine_debug_viz: true
          fine_debug_dir: ./outputs/pixeldit_threecontrol_mixed_cycle005_seg_fine_debug
          fine_debug_every: 100
          fine_debug_max_images: 4
      edge_cycle_loss:
        type: SoftCannyImagePyramidCycleLoss
        init_args:
          loss_res: 128
          smooth_l1_beta: 0.05
          enable_pyramid_cycle_loss: true
          cycle_scales:
          - 512
          - 256
          - 128
          - 64
          cycle_scale_weights:
          - 0.1
          - 0.25
          - 1.0
          - 0.25
          gaussian_kernel: 11
          threshold_min: 0.2745
          threshold_max: 0.5882
          temperature: 0.03
validation:
  enabled: true
  every_n_steps: 500
  image_root: ./data/blip/extracted_new/sa_000201
  depth_root: ./data/blip_depth_da3_nested_giant_large_1_1/sa_000201
  seg_root: ./data/blip_sam2_large_extracted/sa_000201
  edge_root: ./data/blip_edge/sa_000201
  num_controls: 3
  control_modes:
  - depth
  - seg
  - edge
  - depth_seg
  - depth_edge
  - seg_edge
  - depth_seg_edge
  resolution: 512
  max_samples: 50
  batch_size: 8
  num_sampling_steps: 50
  cfg_scale: 2.75
  seed: 2025
  save_dir: val
  negative_prompt: low quality, worst quality, over-saturated, blurry, deformed, watermark
  depth_repeat_to_3ch: false
  invert_depth: false
  seg_normalize: true
  require_caption: true
  cache_index_path: ./outputs/pixeldit_threecontrol_eval_sa000201_index_mixed_cycle005_first200.json
