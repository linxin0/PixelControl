# PixelDiT edge-control v1, single-control training.
# Mirrors pixeldit_depth_control_v1.yaml, but uses precomputed edge maps as
# the single control map. Training data uses sa_000000 through sa_000199.
# This edge-only version intentionally disables structure injection, but keeps
# a small SoftCanny image-cycle consistency loss.
#
# Run with:
#   CUDA_VISIBLE_DEVICES=0,1 NP=2 bash t2i/scripts/run_edge_control_single_first200.sh

data:
  type: PixelSingleControlDataset
  image_size: 512
  load_text_feat: false
  caption_proportion: {prompt: 1}
  external_caption_suffixes: []
  external_clipscore_suffixes: []
  data:
    image_root: ./data/blip/extracted
    control_root: ./data/blip_edge
    control_type: edge
    control_normalize: true
    resolution: 512
    require_caption: true
    cache_index_path: ./outputs/pixeldit_edge_pair_index_first200.json
    subdir_range: [0, 199]

model:
  model: PixDiTControlTrainer
  image_size: 512
  multi_scale: false
  mixed_precision: bf16
  fp32_attention: true
  qk_norm: false
  attn_type: linear
  ffn_type: glumbconv
  use_pe: false
  class_dropout_prob: 0.1
  aspect_ratio_type: ASPECT_RATIO_512
  extra:
    patch_size: 16
    hidden_size: 1536
    pixel_hidden_size: 16
    pixel_attn_hidden_size: 1152
    num_groups: 24
    pixel_num_groups: 16
    patch_depth: 14
    pixel_depth: 2
    num_text_blocks: 4
    txt_embed_dim: 2304
    txt_max_length: 300
    use_text_rope: true
    text_rope_theta: 10000.0
    repa_encoder_index: 6
    use_depth_condition: true
    control_mode: single
    depth_channels: 1
    n_local_controls: 1
    depth_base_channels: 64
    depth_max_channels: 512
    inject_every: 1
    init_gate: 1.0
    enable_structure_inject: false
    alpha_inject: 0.0
    freeze_backbone: true
    pretrained_ckpt: ./pixeldit_t2i_v1.pth
    load_strict: false
    load_prefix: "core."

text_encoder:
  text_encoder_name: gemma-2-2b-it
  caption_channels: 2304
  model_max_length: 300
  y_norm: true
  y_norm_scale_factor: 0.01
  chi_prompt:
    - 'Given a user prompt, generate an "Enhanced prompt" that provides detailed visual descriptions suitable for image generation. Evaluate the level of detail in the user prompt:'
    - '- If the prompt is simple, focus on adding specifics about colors, shapes, sizes, textures, and spatial relationships to create vivid and concrete scenes.'
    - '- If the prompt is already detailed, refine and enhance the existing details slightly without overcomplicating.'
    - 'Here are examples of how to transform or refine prompts:'
    - '- User Prompt: A cat sleeping -> Enhanced: A small, fluffy white cat curled up in a round shape, sleeping peacefully on a warm sunny windowsill, surrounded by pots of blooming red flowers.'
    - '- User Prompt: A busy city street -> Enhanced: A bustling city street scene at dusk, featuring glowing street lamps, a diverse crowd of people in colorful clothing, and a double-decker bus passing by towering glass skyscrapers.'
    - 'Please generate only the enhanced description for the prompt below and avoid including any additional commentary or evaluations:'
    - 'User Prompt: '

scheduler:
  train_sampling_steps: 1000
  predict_flow_v: true
  noise_schedule: linear_flow
  flow_shift: 4.0
  weighting_scheme: logit_normal
  logit_mean: 0.0
  logit_std: 1.0
  pred_sigma: false
  learn_sigma: false
  vis_sampler: flow_dpm-solver
  sigma_data: 0.5
  timestep_norm_scale_factor: 1.0

train:
  train_batch_size: 16
  num_epochs: 100
  num_workers: 10
  seed: 1
  gradient_accumulation_steps: 4
  grad_checkpointing: true
  gradient_clip: 0.1
  optimizer:
    type: CAMEWrapper
    lr: 2.0e-5
    betas: [0.9, 0.999, 0.9999]
    eps: [1.0e-30, 1.0e-16]
    weight_decay: 0.0
  override_lr_on_resume: true
  lr_schedule: constant
  lr_schedule_args:
    num_warmup_steps: 2000
  local_save_vis: true
  visualize: true
  save_model_steps: 2000
  save_model_epochs: 5
  log_interval: 20
  ema_update: true
  ema_rate: 0.999
  repa_loss_weight: 0.0
  early_stop_hours: 10000.0
  null_embed_root: ./output/pretrained_models/
  valid_prompt_embed_root: ./output/tmp_embed/

vae:
  vae_type: none
  vae_latent_dim: 3
  vae_downsample_rate: 1

work_dir: ./universal_pix_t2i_workdirs/exp_pixeldit_edge_control_v1_512_bs16x2_acc4_noinj_softcanny001_first200
report_to: tensorboard
tracker_project_name: pixeldit_control
name: pixeldit_edge_control_v1_512_bs16x2_acc4_noinj_softcanny001_first200
loss_report_name: loss

validation:
  enabled: true
  every_n_steps: 500
  image_root: ./data/blip/extracted_new/sa_000201
  edge_root: ./data/blip_edge/sa_000201
  num_controls: 1
  control_modes: [edge]
  resolution: 512
  max_samples: 500
  batch_size: 8
  num_sampling_steps: 50
  cfg_scale: 2.75
  seed: 2025
  save_dir: val
  negative_prompt: "low quality, worst quality, over-saturated, blurry, deformed, watermark"
  require_caption: true
  cache_index_path: ./outputs/pixeldit_edge_eval_sa000201_index.json

control:
  enabled: true
  mode: single
  inject_t_min: 0.0
  inject_t_max: 1.0
  cycle_weight: 0.01
  cycle_t_min: 0.3
  cycle_t_max: 1.0
  cycle_subbatch_size: 2
  cycle_apply_every: 1
  enable_control_dropout: false
  num_controls: 1
  control_modes: [edge]
  control_probs: [1.0]
  cycle_loss:
    type: MultiConditionCycleLoss
    init_args:
      depth_cycle_loss: null
      seg_cycle_loss: null
      depth_weight: 0.0
      seg_weight: 0.0
      edge_weight: 1.0
      edge_cycle_loss:
        type: SoftCannyImagePyramidCycleLoss
        verifier: soft_canny
        init_args:
          loss_res: 128
          smooth_l1_beta: 0.05
          enable_pyramid_cycle_loss: true
          cycle_scales: [512, 256, 128, 64]
          cycle_scale_weights: [0.75, 0.5, 0.5, 0.25]
          gaussian_kernel: 11
          threshold_min: 0.2745
          threshold_max: 0.5882
          temperature: 0.03
